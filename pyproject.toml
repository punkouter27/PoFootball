[project]
name = "pofootball"
version = "0.1.0"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8.0", "ruff==0.17.6"]

[tool.pytest.ini_options]
pythonpath = [".", "Tools"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".claude", ".venv", "Library", "Temp", "Packages", "results", "Builds", "Logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
