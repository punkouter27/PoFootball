# PoFootball -- CONTRACT_REVISION 17. football_base27 WARM-STARTED, with the quarterback
# unable to pitch before his call latches (Agent_ActionLegality.CanLateral).
#
# Pairs 1:1 with run-id `football_base28` (UNITY_RULES section 1).
#
# WHY. base26 and base27 never threw: Editor_PassDiagnostic (2026-11-05, base27 at
# Offense 2.5M) saw the ball leave the quarterback 6-23 ticks after the snap on 139 of
# 140 scrimmage plays -- a PITCH, the only release the mask enabled before the call
# latches at DROPBACK_TICKS (40). Pass calls latched after the ball had gone. The
# dropback-charge fix in base27 (Reward_Progress.HoldsBaselineInBackfield) stays, but
# it was aimed at the wrong cause. Shapes are unchanged, so every brain warm-starts
# from base27's final checkpoint (stopped early at Offense 2.6M).
#
# Launch (CUDA_VISIBLE_DEVICES=-1 is MANDATORY on this machine -- see CLAUDE.md).
# REBUILD Builds/FootballEnv FIRST: the rule change is C#.
#   .venv\Scripts\python.exe Tools\run_unattended.py --run football_base28 `
#     --config Config\FootballBase28.yaml --hours 8 --stall-after 1500000 --realism-in-editor
#
# WHAT TO READ: Pass/CompletionPerAttempt and Pass/IncompletionPerAttempt well above
# zero (the ball is thrown), Play/SackRate leaving zero, then the realism line.
behaviors:
  Offense: &football_brain
    trainer_type: poca
    init_path: results/football_base27/Offense/checkpoint.pt  # WARM: base27 final

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState emits [-1, 1] already;
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99               # Reward_Role.TRAINER_GAMMA must match.
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 16000000

    # One whole play: (MAX_PHYSICS_TICKS 600 + PRESNAP_TICKS 20) / DECISION_PERIOD 5.
    # Pinned by Systems_ContractTests.
    time_horizon: 124

    summary_freq: 50000
    threaded: false               # deterministic ordering (UNITY_RULES section 2)

  Defense:
    <<: *football_brain
    init_path: results/football_base27/Defense/checkpoint.pt  # WARM: base27 final

  Quarterback:
    <<: *football_brain
    init_path: results/football_base27/Quarterback/checkpoint.pt  # WARM: base27 final
    trainer_type: ppo
    max_steps: 1600000
    checkpoint_interval: 10000
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  DefenseCall:
    <<: *football_brain
    init_path: results/football_base27/DefenseCall/checkpoint.pt  # WARM: base27 final
    trainer_type: ppo
    max_steps: 40000
    checkpoint_interval: 1000
    summary_freq: 1000
    time_horizon: 8                 # every episode is one step
    hyperparameters:
      batch_size: 64
      buffer_size: 640
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

environment_parameters:
  spot_lesson: 2.0                # FullGame; base26 graduated RunFit

env_settings:
  # --env, --num-envs and --base-port go on the command line (see the header).
  # Record --num-envs in the run's MANIFEST.md; promote_brain.py does it for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cpu                     # Not sufficient alone: launch with
                                  # CUDA_VISIBLE_DEVICES=-1 (see CLAUDE.md).

checkpoint_settings:
  results_dir: results
