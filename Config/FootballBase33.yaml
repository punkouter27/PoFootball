# PoFootball -- CONTRACT_REVISION 18. football_base32 WARM-STARTED, with the defense charged
# for a play that runs to the tick ceiling (Reward_Terminal.StallCharge).
#
# Pairs 1:1 with run-id `football_base33` (UNITY_RULES section 1).
#
# WHY. football_base32 (cold, 2026-11-17/18) learned fast -- RunFit graduated at ~600k,
# passes on 85% of plays, 8.3 net yards a play, tackles 0.57 -- then Play/TimeExpiredRate
# went 0 -> 0.02 -> 0.12 between 1.2M and 1.6M Defense steps and the watcher HALTed it.
# A stall is priced exactly as a tackle on the spot, and the time cost is charged to the
# offense only, so the defense was exactly indifferent between the stop and the bell.
# The defense now pays STALL_DEFENSE_CHARGE (0.25) on top of its zero-sum share; the
# offense's price is unchanged. Reward only, shapes unchanged: still revision 18, and
# every brain warm-starts from base32's final checkpoint.
#
# Launch (the runner sets CUDA_VISIBLE_DEVICES=-1 and re-enables CTRL+C):
#   .venv\Scripts\python.exe Tools\run_unattended.py --run football_base33 `
#     --config Config\FootballBase33.yaml --hours 10 --stall-after 1500000 --realism-last 0
# REBUILD Builds/FootballEnv FIRST: the charge is C# (rebuilt 2026-11-18 09:48).
#
# WHAT TO READ: Play/TimeExpiredRate back under 0.05 and Play/LengthTicks back near 210;
# then base31's list -- Play/SackRate leaving zero, Pass/CompletionPerAttempt coming down
# from 0.94 into 0.55-0.70, Play/FlagRate under 0.06, Call/Entropy > 1.2 -- then realism
# (Tools/checkpoint_realism.py --in-editor afterwards).
behaviors:
  Offense: &football_brain
    trainer_type: poca
    init_path: results/football_base32/Offense/checkpoint.pt  # WARM: base32 final (1.45-1.6M steps)

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState emits [-1, 1] already;
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99               # Reward_Role.TRAINER_GAMMA must match.
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 16000000

    # One whole play: (MAX_PHYSICS_TICKS 600 + PRESNAP_TICKS 20) / DECISION_PERIOD 5.
    # Pinned by Systems_ContractTests.
    time_horizon: 124

    summary_freq: 50000
    threaded: false               # deterministic ordering (UNITY_RULES section 2)

  Defense:
    <<: *football_brain
    init_path: results/football_base32/Defense/checkpoint.pt  # WARM: base32 final (1.45-1.6M steps)

  Quarterback:
    <<: *football_brain
    init_path: results/football_base32/Quarterback/checkpoint.pt  # WARM: base32 final (1.45-1.6M steps)
    trainer_type: ppo
    max_steps: 1600000
    checkpoint_interval: 10000
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  DefenseCall:
    <<: *football_brain
    init_path: results/football_base32/DefenseCall/checkpoint.pt  # WARM: base32 final (1.45-1.6M steps)
    trainer_type: ppo
    max_steps: 40000
    checkpoint_interval: 1000
    summary_freq: 1000
    time_horizon: 8                 # every episode is one step
    hyperparameters:
      batch_size: 64
      buffer_size: 640
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

environment_parameters:
  spot_lesson: 2.0                # FullGame; base32 graduated RunFit at ~600k

env_settings:
  # --env, --num-envs and --base-port go on the command line (see the header).
  # Record --num-envs in the run's MANIFEST.md; promote_brain.py does it for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cpu                     # Not sufficient alone: launch with
                                  # CUDA_VISIBLE_DEVICES=-1 (see CLAUDE.md).

checkpoint_settings:
  results_dir: results


