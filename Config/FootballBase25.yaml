# PoFootball -- CONTRACT_REVISION 17, the VELOCITY ACTUATOR, and a RUN-FIT DRILL first.
#
# Pairs 1:1 with run-id `football_base25` (UNITY_RULES section 1).
#
# Launch (CUDA_VISIBLE_DEVICES=-1 is MANDATORY on this machine -- see CLAUDE.md).
# NO --initialize-from: Offense, Quarterback and DefenseCall name their own
# init_path below, from football_base24; the Defense brain starts FRESH. REBUILD Builds/FootballEnv FIRST -- revision 17 changes
# what an action does with every shape identical, so a stale revision 16 env is
# NOT refused by the handshake and would train the old actuator under this name.
#   $env:CUDA_VISIBLE_DEVICES = "-1"
#   mlagents-learn Config/FootballBase25.yaml --run-id=football_base25 `
#     --env=Builds/FootballEnv/PoFootball.exe --no-graphics `
#     --base-port=5400 --num-envs=4
# and alongside it, so a known hack ends the run instead of a replay finding it:
#   .venv\Scripts\python.exe Tools\watch_hacks.py --run football_base25 `
#     --stop-trainer --trainer-pid <mlagents-learn PID>
#
# WHY. Every brain's two continuous outputs were a throttle and a steering torque,
# so a policy had to learn to turn a rotating body before it could go anywhere --
# and the brain that never did was the defense: base22 moved at 13-15% of top speed,
# base24 at 5 h still had no sack and a touchdown on 28% of plays. Revision 17 makes
# them a VELOCITY (forward, leftward, in the body's frame at the decision) and
# Agent_VelocityController does the turning, braking and backpedalling. See
# Agent_ActionContract revision 17.
#
# WARM START ACROSS A REVISION, ON PURPOSE. The shapes are identical and slot 0 is
# still "forward" and slot 1 still "left" (the way positive steer turned), so
# base24's habits point the same way under the new actuator; PPO adapts the rest.
# EXCEPT THE DEFENSE, which starts from nothing, as base23's did: base24's was still
# passive at 5.5 h (no sack, a touchdown on 39% of plays), and a passive brain is
# the one habit not worth keeping. Nothing trained here can be promoted into a revision 16 build, and
# base24 can be promoted only from commit 5e53d25.
#
# THE DRILL. Lesson RunFit (spot_lesson 3, Systems_RandomSpotProvider.LESSON_RUN_FIT)
# snaps first to third down anywhere on the field and masks every pass, so every
# play puts a carrier in front of the defense. It graduates to FullGame on the
# DEFENSE's own result: the DefenseCall brain is paid exactly the defense's
# terminal reward, once a play, so its smoothed mean is "how the defense is doing".
# A stop is +0.5, a stop that concedes a first down +0.2, a touchdown -1.0; a run
# game at football's rates (~4.3 a carry, few long ones) is worth ~+0.35 a play to
# the defense, and base24's FullGame defense was at -0.07. The bar is 0.25, over at
# least 1000 plays (~1.75 h: the coordinator decides ~570 times an hour). If it
# never graduates the defense never learned to fit the run, which is the answer.
#
# WHAT TO READ IN THIS RUN:
#   Environment/Lesson Number/spot_lesson   0 is RunFit, 1 FullGame
#   Control/CommandJerk       new: change in the velocity command per decision
#   Reward/<brain>/ShapingShare  new: the role term's share of all reward paid
#   Play/TackleRate, Play/TouchdownRate in RunFit; then SackRate leaving 0 in FullGame
#   Tools/watch_hacks.py reads all of these.
#
# AFTER IT FINISHES:
#   .venv\Scripts\python.exe Tools\checkpoint_realism.py --run football_base25 --last 4
#   then promote the best checkpoint it names with promote_brain.py and Build Brain
#   Table, as ever. A revision 17 realism report of the SCRIPTED players is owed
#   too: they drive the same controller.

behaviors:
  Offense: &football_brain
    trainer_type: poca
    init_path: results/football_base24/Offense/checkpoint.pt

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState emits [-1, 1] already;
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99               # Reward_Role.TRAINER_GAMMA must match.
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 8000000

    # One whole play: (MAX_PHYSICS_TICKS 600 + PRESNAP_TICKS 20) / DECISION_PERIOD 5.
    # Pinned by Systems_ContractTests.
    time_horizon: 124

    summary_freq: 50000
    threaded: false               # deterministic ordering (UNITY_RULES section 2)

  Defense:
    <<: *football_brain
    init_path: null                 # FRESH; see the header

  Quarterback:
    <<: *football_brain
    init_path: results/football_base24/Quarterback/checkpoint.pt
    trainer_type: ppo
    max_steps: 800000
    checkpoint_interval: 10000
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  DefenseCall:
    <<: *football_brain
    init_path: results/football_base24/DefenseCall/checkpoint.pt
    trainer_type: ppo
    max_steps: 16000
    checkpoint_interval: 1000
    summary_freq: 1000
    time_horizon: 8                 # every episode is one step
    hyperparameters:
      batch_size: 64
      buffer_size: 640
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

environment_parameters:
  spot_lesson:
    curriculum:
      - name: RunFit
        completion_criteria:
          measure: reward
          behavior: DefenseCall
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.25
        value: 3.0
      - name: FullGame
        value: 2.0

env_settings:
  # --env, --num-envs and --base-port go on the command line (see the header).
  # Record --num-envs in the run's MANIFEST.md; promote_brain.py does it for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cpu                     # Not sufficient alone: launch with
                                  # CUDA_VISIBLE_DEVICES=-1 (see CLAUDE.md).

checkpoint_settings:
  results_dir: results
