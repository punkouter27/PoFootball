# PoFootball -- CONTRACT_REVISION 18. Every brain WARM-STARTED from Football_v04's own
# checkpoints (football_base28 at 100k steps); rewards and hyperparameters as base29/30.
#
# Pairs 1:1 with run-id `football_base31` (UNITY_RULES section 1).
#
# WHAT CHANGED. The quarterback's call latches -- and the first pass becomes legal --
# 1.5 s after the snap, not 0.8 s (Systems_SimConstants.DROPBACK_TICKS 40 -> 75).
#
# WHY. Football_v04 threw a median 1.0 s after the snap, never later than 1.7 s
# (results/audit/pass-diag-20261107-131517.csv). No rusher gets through the line that
# fast, so every run read Play/SackRate ~0 and every realism game 0-1 sacks, with
# completions at 0.69-0.77. football_base30 cut flags to ~3% but got WORSE on realism
# the longer it trained (2.4M: -0.68 yd/carry; 4.3M: 12 yd/play), so this starts
# from v04 (4 of 5 bands), not from base30.
#
# ONE CHANGE ONLY: no reward was touched, so whatever the realism line does is the
# latch. A sack bonus is the next experiment if the rush still never arrives.
#
# Launch (the runner sets CUDA_VISIBLE_DEVICES=-1 and re-enables CTRL+C):
#   .venv/Scripts/python.exe Tools/run_unattended.py --run football_base31
#     --config Config/FootballBase31.yaml --hours 8 --stall-after 1500000 --realism-last 0
# REBUILD Builds/FootballEnv FIRST: the latch is C#.
#
# WHAT TO READ: Play/SackRate leaving zero (real football ~0.06 a dropback),
# Pass/CompletionPerAttempt coming down into 0.55-0.70, Play/FlagRate under 0.06,
# Call/Entropy > 1.2; then the realism line, rush yd/carry above all.
behaviors:
  Offense: &football_brain
    trainer_type: poca
    init_path: results/football_base28/Offense/Offense-99986.pt  # WARM: Football_v04 source

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState emits [-1, 1] already;
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99               # Reward_Role.TRAINER_GAMMA must match.
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 16000000

    # One whole play: (MAX_PHYSICS_TICKS 600 + PRESNAP_TICKS 20) / DECISION_PERIOD 5.
    # Pinned by Systems_ContractTests.
    time_horizon: 124

    summary_freq: 50000
    threaded: false               # deterministic ordering (UNITY_RULES section 2)

  Defense:
    <<: *football_brain
    init_path: results/football_base28/Defense/Defense-99980.pt  # WARM: Football_v04 source

  Quarterback:
    <<: *football_brain
    init_path: results/football_base28/Quarterback/Quarterback-9994.pt  # WARM: Football_v04 source
    trainer_type: ppo
    max_steps: 1600000
    checkpoint_interval: 10000
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  DefenseCall:
    <<: *football_brain
    init_path: results/football_base28/DefenseCall/DefenseCall-434.pt  # WARM: Football_v04 source
    trainer_type: ppo
    max_steps: 40000
    checkpoint_interval: 1000
    summary_freq: 1000
    time_horizon: 8                 # every episode is one step
    hyperparameters:
      batch_size: 64
      buffer_size: 640
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

environment_parameters:
  spot_lesson: 2.0                # FullGame; base26 graduated RunFit

env_settings:
  # --env, --num-envs and --base-port go on the command line (see the header).
  # Record --num-envs in the run's MANIFEST.md; promote_brain.py does it for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cpu                     # Not sufficient alone: launch with
                                  # CUDA_VISIBLE_DEVICES=-1 (see CLAUDE.md).

checkpoint_settings:
  results_dir: results
