# PoFootball -- CONTRACT_REVISION 18. football_base31 RUN COLD: every brain starts FRESH.
#
# Pairs 1:1 with run-id `football_base32` (UNITY_RULES section 1).
#
# WHY A NEW RUN. football_base31 warm-starts from results/football_base28 (Football_v04's
# checkpoints), and that folder is not on this PC (2026-11-17), as happened to base24/25
# before base26. Everything else is base31: revision 18's 1.5 s latch (DROPBACK_TICKS 75),
# no reward change. Unlike base25-27, which never threw, this code already has both fixes
# those runs lacked: no dropback charge (base27) and no pitch before the latch (base28).
# With no warm start, it runs the RunFit drill first, as base26 did.
#
# Launch (the runner sets CUDA_VISIBLE_DEVICES=-1 and re-enables CTRL+C):
#   .venv\Scripts\python.exe Tools\run_unattended.py --run football_base32 
#     --config Config\FootballBase32.yaml --hours 10 --stall-after 1500000 --realism-last 0
#
# WHAT TO READ: the drill graduating (DefenseCall reward >= 0.25), then base31's list:
# Pass/CompletionPerAttempt and IncompletionPerAttempt leaving zero (the ball is thrown),
# Play/SackRate leaving zero, Play/FlagRate under 0.06, Call/Entropy > 1.2; then realism
# (Tools/checkpoint_realism.py --in-editor afterwards).
behaviors:
  Offense: &football_brain
    trainer_type: poca
    init_path: null                 # FRESH: football_base28 checkpoints are not on this PC

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState emits [-1, 1] already;
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99               # Reward_Role.TRAINER_GAMMA must match.
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 16000000

    # One whole play: (MAX_PHYSICS_TICKS 600 + PRESNAP_TICKS 20) / DECISION_PERIOD 5.
    # Pinned by Systems_ContractTests.
    time_horizon: 124

    summary_freq: 50000
    threaded: false               # deterministic ordering (UNITY_RULES section 2)

  Defense:
    <<: *football_brain
    init_path: null                 # FRESH: football_base28 checkpoints are not on this PC

  Quarterback:
    <<: *football_brain
    init_path: null                 # FRESH: football_base28 checkpoints are not on this PC
    trainer_type: ppo
    max_steps: 1600000
    checkpoint_interval: 10000
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  DefenseCall:
    <<: *football_brain
    init_path: null                 # FRESH: football_base28 checkpoints are not on this PC
    trainer_type: ppo
    max_steps: 40000
    checkpoint_interval: 1000
    summary_freq: 1000
    time_horizon: 8                 # every episode is one step
    hyperparameters:
      batch_size: 64
      buffer_size: 640
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

environment_parameters:
  # From scratch, so the RunFit drill first (base26's curriculum), then FullGame.
  spot_lesson:
    curriculum:
      - name: RunFit
        completion_criteria:
          measure: reward
          behavior: DefenseCall
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.25
        value: 3.0
      - name: FullGame
        value: 2.0

env_settings:
  # --env, --num-envs and --base-port go on the command line (see the header).
  # Record --num-envs in the run's MANIFEST.md; promote_brain.py does it for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cpu                     # Not sufficient alone: launch with
                                  # CUDA_VISIBLE_DEVICES=-1 (see CLAUDE.md).

checkpoint_settings:
  results_dir: results

