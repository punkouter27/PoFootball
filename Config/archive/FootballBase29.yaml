# PoFootball -- CONTRACT_REVISION 17. football_base28's realism-best checkpoint
# (100k steps) WARM-STARTED, with every flag also charged to the man who drew it
# (Reward_Terminal.OwnFouls).
#
# Pairs 1:1 with run-id `football_base29` (UNITY_RULES section 1).
#
# WHY. football_base28 was the first run whose quarterback threw (the no-pitch-before-
# the-call fix): its 100k checkpoint passed all five realism bands once (Football_v04),
# then 4 of 5 on a re-run (rush 2.29 yd/carry). The run was HALTED at 250k by the flag
# rule -- Play/FlagRate 0.05-0.19, roughing the passer on 7 of 46 realism plays: rushers
# arriving after the throw. The flag was priced only to the defense as a group, split
# over eleven men. The fouler now pays it himself too. Warm from the 100k checkpoint,
# the last one before the flag rate ran away.
#
# Launch (CUDA_VISIBLE_DEVICES=-1 is MANDATORY on this machine -- see CLAUDE.md).
# REBUILD Builds/FootballEnv FIRST: the reward change is C#.
#   .venv\Scripts\python.exe Tools\run_unattended.py --run football_base29 `
#     --config Config\FootballBase29.yaml --hours 8 --stall-after 1500000 --realism-in-editor
#
# WHAT TO READ: Play/FlagRate back under 0.06 and staying there, Play/SackRate leaving
# zero, Pass/CompletionPerAttempt holding 0.55-0.75, then the realism line.
behaviors:
  Offense: &football_brain
    trainer_type: poca
    init_path: results/football_base28/Offense/Offense-99986.pt  # WARM: base28 realism-best

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState emits [-1, 1] already;
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99               # Reward_Role.TRAINER_GAMMA must match.
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 16000000

    # One whole play: (MAX_PHYSICS_TICKS 600 + PRESNAP_TICKS 20) / DECISION_PERIOD 5.
    # Pinned by Systems_ContractTests.
    time_horizon: 124

    summary_freq: 50000
    threaded: false               # deterministic ordering (UNITY_RULES section 2)

  Defense:
    <<: *football_brain
    init_path: results/football_base28/Defense/Defense-99980.pt  # WARM: base28 realism-best

  Quarterback:
    <<: *football_brain
    init_path: results/football_base28/Quarterback/Quarterback-9994.pt  # WARM: base28 realism-best
    trainer_type: ppo
    max_steps: 1600000
    checkpoint_interval: 10000
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  DefenseCall:
    <<: *football_brain
    init_path: results/football_base28/DefenseCall/DefenseCall-434.pt  # WARM: base28 realism-best
    trainer_type: ppo
    max_steps: 40000
    checkpoint_interval: 1000
    summary_freq: 1000
    time_horizon: 8                 # every episode is one step
    hyperparameters:
      batch_size: 64
      buffer_size: 640
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

environment_parameters:
  spot_lesson: 2.0                # FullGame; base26 graduated RunFit

env_settings:
  # --env, --num-envs and --base-port go on the command line (see the header).
  # Record --num-envs in the run's MANIFEST.md; promote_brain.py does it for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cpu                     # Not sufficient alone: launch with
                                  # CUDA_VISIBLE_DEVICES=-1 (see CLAUDE.md).

checkpoint_settings:
  results_dir: results
