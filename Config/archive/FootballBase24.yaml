# PoFootball -- CONTRACT_REVISION 16, the DEFENSE PAID FOR THE ANGLE, not the chase.
#
# Pairs 1:1 with run-id `football_base24` (UNITY_RULES section 1).
#
# Launch (CUDA_VISIBLE_DEVICES=-1 is MANDATORY on this machine -- see CLAUDE.md).
# NO --initialize-from: every behavior names its own init_path below, all four
# from football_base23. REBUILD Builds/FootballEnv first -- the reward moved in
# game code (Agent_FootballPlayer / Reward_Role), and a stale env still pays the
# old pursuit term without any handshake noticing.
#   $env:CUDA_VISIBLE_DEVICES = "-1"
#   mlagents-learn Config/FootballBase24.yaml --run-id=football_base24 `
#     --env=Builds/FootballEnv/PoFootball.exe --no-graphics `
#     --base-port=5400 --num-envs=4
#
# WHY. football_base23 retrained the Defense brain from scratch because base22's
# stood off (see FootballBase23's header): drive output 0.10, 13-15% of top speed,
# no sacks, 89% completions. base23 was cut to ~1h on 2026-10-17, far short of what
# a fresh brain needs, and the one dense term the defense had was still the wrong
# one. It paid 0.004 a metre of DISTANCE closed on the ball -- minimised by running
# at the carrier's current spot, i.e. pure pursuit, which arrives where he was and,
# at the equal top speeds Systems_RoleTable gives a corner and a receiver, never
# arrives at all. Agent_FootballPlayer.InterceptOf says the same of the heuristic.
#
# THE CHANGE (reward only; every shape and every rule unchanged, so still revision
# 16 and base23's weights load). A defender is now paid the fall in its TIME TO
# INTERCEPT the ball -- the carrier at his current velocity, the defender at its own
# trait-adjusted top speed -- as potential-based shaping:
#   r = gamma_tick * Phi(s') - Phi(s),   Phi = 0.012 * (8 - min(t_intercept, 8))
# with gamma_tick = 0.99^(1/5) (this file's gamma spread over DECISION_PERIOD). It
# is policy-invariant (Ng, Harada & Russell 1999), it is bounded at 0.096 per
# defender per play (a fifth of a tackle), it pays exactly nothing to a defender
# out of reach and costs a little to one who shadows without closing. Still off
# while the ball is in the air. The offense keeps the distance term when chasing a
# defender who has the ball. Reward_Role.InterceptShaping; Reward_Tests pins it.
#
# If gamma below ever changes, Reward_Role.TRAINER_GAMMA must change with it.
#
# Same hyperparameters as base23, FullGame only, a ten-hour window.
#
# WHAT TO READ IN THIS RUN:
#   Play/SackRate             leaving 0 is the first sign the pass rush takes angles.
#   Play/TouchdownRate        falling; base22 sat at 10% of plays.
#   Pass/CompletionPerAttempt falling from base22's 0.87-0.89 toward the 0.50-0.80 band.
#   Control/SpeedUtilization  the defense's should climb well past base22's 0.13-0.15.
#   DefenseCall/<front>, Call/Entropy, Play/FlagRate -- as in base23.
#
# AFTER IT FINISHES:
#   .venv\Scripts\python.exe Tools\promote_brain.py --run football_base24 `
#     --version 04 --num-envs 4
#   then Unity: Tools > PoFootball > Build Brain Table, Evaluate Realism (4 fixed
#   seeds), and promote_brain.py --version 04 --check-realism <report>.

behaviors:
  # MA-POCA for the two ten- and eleven-man groups; see archive/FootballBase11.yaml
  # for why, and Systems_BrainGroup for why there are three behaviours, not six.
  Offense: &football_brain
    trainer_type: poca
    init_path: results/football_base23/Offense/checkpoint.pt

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState emits [-1, 1] already;
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 8000000              # a ten-hour window at ~0.8M Offense steps an hour

    # One whole play: (MAX_PHYSICS_TICKS 600 + PRESNAP_TICKS 20) / DECISION_PERIOD 5.
    # Pinned by Systems_ContractTests.
    time_horizon: 124

    summary_freq: 50000
    threaded: false               # deterministic ordering (UNITY_RULES section 2)

  Defense:
    <<: *football_brain
    init_path: results/football_base23/Defense/checkpoint.pt

  Quarterback:
    <<: *football_brain
    init_path: results/football_base23/Quarterback/checkpoint.pt
    trainer_type: ppo
    max_steps: 800000
    checkpoint_interval: 10000      # the QB steps 10x slower; at 100000 a stop before 100k lost the whole brain
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-2                # ten times the movement brains; see Base11
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  # Revision 16: the defensive coordinator. No body, one decision a play (the
  # front), so its own small net and its own exploration bonus -- ten times the
  # movement brains', as the quarterback's is. In football_base17 the front sat on
  # the Defense brain's 5e-3 and collapsed onto the zero blitz by 2M steps.
  DefenseCall:
    <<: *football_brain
    init_path: results/football_base23/DefenseCall/checkpoint.pt
    trainer_type: ppo
    max_steps: 16000                # ~one decision a play; ~1.5k an hour
    checkpoint_interval: 1000
    summary_freq: 1000
    time_horizon: 8                 # every episode is one step
    hyperparameters:
      batch_size: 64
      buffer_size: 640
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

environment_parameters:
  # FullGame only: the offense's weights finished OpenFieldEarlyDowns in base21. Kickoffs and tries are drawn only in this lesson
  # (Systems_RandomSpotProvider).
  spot_lesson: 2.0

env_settings:
  # --env, --num-envs and --base-port go on the command line (see the header).
  # Record --num-envs in the run's MANIFEST.md; promote_brain.py does it for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cpu                     # Not sufficient alone: launch with
                                  # CUDA_VISIBLE_DEVICES=-1 (see CLAUDE.md).

checkpoint_settings:
  results_dir: results
