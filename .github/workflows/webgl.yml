name: Deploy WebGL

# PoFootball's one workflow.
#
# Every push, pull request, release and manual run: the Python checks (ruff format --check, ruff check, pytest).
# The Unity EditMode/PlayMode tests and the WebGL build run locally (AGENTS.md section 3): Unity needs a licence
# and CI has none.
#
# The WebGL player is built LOCALLY by Tools/publish_webgl.ps1, which uploads it as webgl.zip on a GitHub Release
# tagged webgl-*. Publishing that release runs the deploy job here on a GitHub-hosted runner: download the zip ->
# stamp the release's commit into every response as X-Commit -> deploy to the game's Azure Static Web App -> check
# that the live page is this build (X-Commit = the release's commit) and that /diag answers.
#
# Re-deploy an existing build: Actions -> Deploy WebGL -> Run workflow, with its tag
# (empty = the newest webgl-* release).
#
# Repo secret it needs:
#   AZURE_STATIC_WEB_APPS_API_TOKEN   the game's Static Web App deployment token
on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: webgl-* release tag to deploy (empty = newest)
        required: false

permissions:
  contents: read

concurrency:
  group: webgl-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Install (dev group)
        run: uv sync --only-dev
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q

  deploy:
    needs: python
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'webgl-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the WebGL build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("webgl-"))] | sort_by(.createdAt) | last | .tagName')
          fi
          test -n "$TAG" || { echo "No webgl-* release. Run Tools/publish_webgl.ps1 first."; exit 1; }
          echo "Deploying $TAG"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p webgl.zip -D .
          mkdir site && unzip -q webgl.zip -d site
          test -f site/index.html || { echo "webgl.zip of $TAG has no index.html at its root"; exit 1; }
          test -f site/staticwebapp.config.json || { echo "webgl.zip of $TAG has no staticwebapp.config.json (.unityweb would 404)"; exit 1; }
          # The commit the build was made from (the release is tagged at it) goes into every response as X-Commit.
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          test -n "$SHA" || { echo "Cannot resolve $TAG to a commit"; exit 1; }
          jq --arg sha "$SHA" '.globalHeaders = ((.globalHeaders // {}) + {"X-Commit": $sha})' site/staticwebapp.config.json > swa.json
          mv swa.json site/staticwebapp.config.json
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Deploy to Azure Static Web App
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true

      # The page is live, is this build's Unity WebGL page (X-Commit = the release's commit), and /diag answers.
      - name: Check the live page, X-Commit and /diag
        env:
          URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          for i in $(seq 1 20); do
            live=$(curl -fsS -o /dev/null -D - --max-time 30 "$URL/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-commit"{print $2}')
            if [ "$live" = "$SHA" ] && curl -fsS --max-time 30 "$URL/" | grep -q 'loader.js'; then
              echo "Live: $URL at X-Commit $live"
              curl -fsS --max-time 30 "$URL/diag" | grep -q 'System status' || { echo "/diag did not answer"; exit 1; }
              echo "/diag answers"
              exit 0
            fi
            echo "waiting: X-Commit '$live', want $SHA"
            sleep 15
          done
          echo "$URL did not serve this build (X-Commit $SHA)"; exit 1
